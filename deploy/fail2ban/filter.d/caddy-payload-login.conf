# EXAMPLE — install on the VPS host as /etc/fail2ban/filter.d/caddy-payload-login.conf
#
# Matches failed logins in Caddy's JSON access log (/var/log/caddy/access.log).
# Payload 3.92.1 answers POST /api/users/login with 401 for BOTH a wrong
# email/password (AuthenticationError) and a locked account (LockedAuth).
# A successful login is 200 and does not match.
#
# Caddy runs with network_mode: host, so request.client_ip is the real client IP.
# Caddy writes "ts" (unix epoch) first, then request{client_ip, method, uri, …},
# then status — the regex relies on that order.

[Definition]
failregex = ^\{.*"client_ip":"<ADDR>".*"method":"POST".*"uri":"/api/users/login(?:\?[^"]*)?".*"status":401[,}]
ignoreregex =
datepattern = "ts":{EPOCH}
