<!doctype html>
<!--
  Static theme mockup — Advisor Attendance System (ระบบครูที่ปรึกษา),
  โรงเรียนโนนหันวิทยายน. This is a THROWAWAY visual reference for the
  red–gold theme only. It is NOT the real app: no framework, no build step,
  no navigation or logic. Buttons are visual placeholders. Open directly in a browser.
-->
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ระบบครูที่ปรึกษา — ตัวอย่างธีม (Theme Mockup)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Brand chrome — red–gold */
      --red: #9E1B1E;
      --red-dark: #7A1114;
      --gold: #D4AF37;
      --cream: #FBF4E4;
      --surface: #FFFFFF;
      --ink: #2B2B2B;

      /* Functional action-button colors */
      --amber: #F5A800;
      --blue: #1F6FEB;
      --green: #1E8E4E;
      --danger: #D23442;

      /* On-color text */
      --on-dark: #FFFFFF;
      --on-amber: #2B2B2B;

      --radius: 12px;
      --maxw: 1080px;
      --shadow: 0 2px 10px rgba(0, 0, 0, .08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: "Sarabun", "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
      overflow-x: hidden; /* no horizontal scroll */
    }

    a { color: inherit; text-decoration: none; }

    .wrap {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 16px; /* 16px side gutter */
    }

    /* ---------- Navbar ---------- */
    .navbar {
      background: var(--red);
      color: var(--on-dark);
      border-bottom: 2px solid var(--gold);
    }
    .navbar .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 60px;
      padding-top: 10px;
      padding-bottom: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .brand .bk { font-size: 1.3rem; line-height: 1; }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 500;
    }
    .nav-user { white-space: nowrap; }
    .menu-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, .14);
      border: 1px solid var(--gold);
      color: var(--on-dark);
      border-radius: 999px;
      padding: 6px 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .menu-btn:hover { background: rgba(255, 255, 255, .26); }

    /* ---------- Hero ---------- */
    .hero {
      margin: 20px 0 0;
      background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
      color: var(--on-dark);
      border-radius: var(--radius);
      border-top: 4px solid var(--gold);
      box-shadow: var(--shadow);
      padding: 26px 22px;
      text-align: center;
    }
    .hero h1 {
      margin: 0 0 6px;
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 700;
      letter-spacing: .3px;
    }
    .hero .school {
      margin: 0 auto 14px;
      max-width: 640px;
      color: #F6E7C9;
      font-size: clamp(.95rem, 3.4vw, 1.1rem);
    }
    .hero .date {
      display: inline-block;
      margin-top: 4px;
      padding: 6px 16px;
      background: rgba(212, 175, 55, .18);
      border: 1px solid var(--gold);
      border-radius: 999px;
      color: #FDF3D8;
      font-weight: 500;
      font-size: .95rem;
    }

    /* ---------- Logo crest ---------- */
    .crest-wrap {
      display: flex;
      justify-content: center;
      margin: -34px 0 10px; /* overlap slightly onto hero */
    }
    .crest {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: var(--cream);
      border: 4px solid var(--gold);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--red);
      font-weight: 700;
      font-size: 1.5rem;
    }

    /* ---------- Gold hairline divider ---------- */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      border: 0;
      margin: 18px 0 22px;
    }

    /* ---------- Function grid ---------- */
    .grid {
      display: grid;
      grid-template-columns: 1fr; /* mobile-first: 1-up */
      gap: 14px;
      padding-bottom: 8px;
    }
    @media (min-width: 480px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 820px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    .tile {
      --tile: var(--blue);
      --tile-on: var(--on-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      min-height: 104px;        /* thumb-sized */
      padding: 18px 14px;
      background: var(--tile);
      color: var(--tile-on);
      border: 0;
      border-top: 3px solid var(--gold); /* thin gold top accent */
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }
    .tile:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
      box-shadow: 0 6px 16px rgba(0, 0, 0, .16);
    }
    .tile .ic { font-size: 1.7rem; line-height: 1; }
    .tile .lb { font-size: 1rem; }

    .tile.amber  { --tile: var(--amber);  --tile-on: var(--on-amber); }
    .tile.blue   { --tile: var(--blue);   --tile-on: var(--on-dark); }
    .tile.green  { --tile: var(--green);  --tile-on: var(--on-dark); }
    .tile.danger { --tile: var(--danger); --tile-on: var(--on-dark); }

    /* ---------- Footer ---------- */
    footer {
      margin-top: 30px;
      background: var(--red-dark);
      color: #F6E7C9;
      border-top: 2px solid var(--gold);
    }
    footer .wrap {
      padding: 20px 16px 26px;
      text-align: center;
      font-size: .9rem;
    }
    footer .school-name {
      color: var(--on-dark);
      font-weight: 600;
      margin: 6px 0;
    }
    footer .dev {
      margin-top: 10px;
      color: var(--gold);
      font-size: .85rem;
    }

    main { padding-bottom: 8px; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="wrap">
      <div class="brand">
        <span class="bk" aria-hidden="true">📘</span>
        <span>ระบบครูที่ปรึกษา</span>
      </div>
      <div class="nav-right">
        <span class="nav-user">ชื่อ: อาจารย์ที่ปรึกษา</span>
        <button class="menu-btn" type="button">เมนู <span aria-hidden="true">▾</span></button>
      </div>
    </div>
  </nav>

  <main class="wrap">
    <!-- Hero -->
    <section class="hero">
      <h1>ระบบครูที่ปรึกษา</h1>
      <p class="school">โรงเรียนโนนหันวิทยายน องค์การบริหารส่วนจังหวัดขอนแก่น</p>
      <span class="date">วันที่ 30 ต.ค. 2569, 00:09</span>
    </section>

    <!-- Logo crest -->
    <div class="crest-wrap">
      <div class="crest" aria-label="ตราโรงเรียน (placeholder)">ม.ข.</div>
    </div>

    <hr class="divider" />

    <!-- Function grid -->
    <section class="grid" aria-label="เมนูการใช้งาน">
      <!-- row 1 -->
      <button class="tile amber"  type="button"><span class="ic">📌</span><span class="lb">เช็คชื่อ</span></button>
      <button class="tile blue"   type="button"><span class="ic">📄</span><span class="lb">รายงานรายห้อง</span></button>
      <button class="tile blue"   type="button"><span class="ic">📊</span><span class="lb">สถิตินักเรียน</span></button>
      <button class="tile blue"   type="button"><span class="ic">📈</span><span class="lb">กราฟ</span></button>
      <!-- row 2 -->
      <button class="tile green"  type="button"><span class="ic">✏️</span><span class="lb">แก้ไขเช็คชื่อ</span></button>
      <button class="tile blue"   type="button"><span class="ic">📝</span><span class="lb">เช็คชื่อย้อนหลัง</span></button>
      <button class="tile green"  type="button"><span class="ic">⏰</span><span class="lb">นักเรียนมาสาย</span></button>
      <button class="tile blue"   type="button"><span class="ic">🧾</span><span class="lb">รายงานนักเรียน</span></button>
      <!-- row 3 -->
      <button class="tile green"  type="button"><span class="ic">🔑</span><span class="lb">เปลี่ยนรหัสผ่าน</span></button>
      <button class="tile danger" type="button"><span class="ic">🚪</span><span class="lb">Logout</span></button>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="wrap">
      <div>108 ม.9 ถ.มลิวัลย์ ต.โนนสะอาด อ.ชุมแพ จ.ขอนแก่น</div>
      <div class="school-name">โรงเรียนโนนหันวิทยายน องค์การบริหารส่วนจังหวัดขอนแก่น</div>
      <div class="dev">พัฒนาโดย กลุ่มคอมพิวเตอร์</div>
    </div>
  </footer>
</body>
</html>
